      - any-glob-to-any-file:
          - docs/zh-Hant/**
          - controlled-language/references/languages/zh-Hant.md

"lang:ja":
  - changed-files:
      - any-glob-to-any-file:
          - docs/ja/**
          - controlled-language/references/languages/ja.md

"lang:ko":
  - changed-files:
      - any-glob-to-any-file:
          - docs/ko/**
