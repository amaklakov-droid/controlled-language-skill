          - docs/es/**
          - controlled-language/references/languages/es.md

"lang:pt":
  - changed-files:
      - any-glob-to-any-file:
          - docs/pt/**
          - controlled-language/references/languages/pt.md

"lang:zh-Hans":
  - changed-files:
      - any-glob-to-any-file:
          - docs/zh-Hans/**
          - controlled-language/references/languages/zh-Hans.md

"lang:zh-Hant":
