      - any-glob-to-any-file:
          - docs/ar/**
          - controlled-language/references/languages/ar.md

skill:
  - changed-files:
      - any-glob-to-any-file:
          - controlled-language/**

checker:
  - changed-files:
      - any-glob-to-any-file:
          - controlled-language/scripts/**
          - tests/**

infra:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - tools/**
