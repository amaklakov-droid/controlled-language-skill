# Configuration for actions/labeler v5 (.github/workflows/labeler.yml).
# The labeler adds a label when a pull request changes a file that matches one of its globs.

docs:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - docs/**

# Languages: translations of the documentation (one folder for each
# language, not docs/en/) and the language files of the skill.
# When you add a language, add its docs folder here, and add a
# "lang:<code>" entry below with its docs folder and its language file.
i18n:
  - changed-files:
      - any-glob-to-any-file:
          - docs/LANGUAGES.md
          - docs/ru/**
          - docs/de/**
          - docs/fr/**
          - docs/es/**
          - docs/pt/**
          - docs/zh-Hans/**
          - docs/zh-Hant/**
          - docs/ja/**
          - docs/ko/**
          - docs/ar/**
          - controlled-language/references/languages.md
          - controlled-language/references/languages/**

"lang:ru":
  - changed-files:
      - any-glob-to-any-file:
          - docs/ru/**
          - controlled-language/references/languages/ru.md

"lang:de":
  - changed-files:
      - any-glob-to-any-file:
          - docs/de/**
          - controlled-language/references/languages/de.md

"lang:fr":
