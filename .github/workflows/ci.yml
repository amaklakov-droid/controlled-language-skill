name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate JSON
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: Translation status
        run: python tools/i18n_status.py check --github-summary >> "$GITHUB_STEP_SUMMARY"

      # Informational: the project uses its own rules for its English docs.
      - name: Check English docs (Level 2)
        continue-on-error: true
        run: python controlled-language/scripts/check.py --level 2 README.md docs/en
