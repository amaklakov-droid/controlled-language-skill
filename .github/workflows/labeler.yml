name: Labeler

# pull_request_target runs in the context of the base repository, so it can
# label pull requests from forks. This workflow does not check out or run the
# code of the pull request. actions/labeler reads .github/labeler.yml from the
# base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false
